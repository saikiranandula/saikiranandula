<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400&family=Noto+Serif+Telugu:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    font-family: 'Playfair Display', 'Noto Serif Telugu', Georgia, serif;
    position: relative;
  }

  /* ---- themes ---- */
  body.sunrise  { background: linear-gradient(165deg, #ff9a56 0%, #ffad72 25%, #ffd99e 55%, #fff3d6 100%); }
  body.ocean    { background: linear-gradient(165deg, #0f4c81 0%, #2478a8 40%, #7fc8d6 75%, #e8f7f4 100%); }
  body.garden   { background: linear-gradient(165deg, #2d6a4f 0%, #52b788 45%, #b7e4c7 80%, #f1faee 100%); }
  body.lavender { background: linear-gradient(165deg, #6d5b98 0%, #967bb6 40%, #d7c7e8 75%, #fdf6ff 100%); }
  body.golden   { background: linear-gradient(165deg, #a4611c 0%, #d99a3d 40%, #f2cd79 75%, #fdf3da 100%); }
  body.forest   { background: linear-gradient(165deg, #1b4332 0%, #40694f 40%, #a3b899 75%, #f0ead2 100%); }

  .sunrise  { --accent: #b64b12; --ink: #5a2d0c; --soft: rgba(255,255,255,0.55); }
  .ocean    { --accent: #0b3d66; --ink: #10344f; --soft: rgba(255,255,255,0.6);  }
  .garden   { --accent: #1b4332; --ink: #14352a; --soft: rgba(255,255,255,0.6);  }
  .lavender { --accent: #4a3670; --ink: #3a2c57; --soft: rgba(255,255,255,0.6);  }
  .golden   { --accent: #7c4a0e; --ink: #543208; --soft: rgba(255,255,255,0.6);  }
  .forest   { --accent: #163828; --ink: #14291f; --soft: rgba(255,255,255,0.6);  }

  /* decorative circles */
  .circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
  }
  .c1 { width: 420px; height: 420px; top: -140px; right: -120px; }
  .c2 { width: 260px; height: 260px; bottom: -80px; left: -90px; background: rgba(255,255,255,0.14); }
  .c3 { width: 120px; height: 120px; top: 200px; left: 70px; background: rgba(255,255,255,0.12); }
  .c4 { width: 70px;  height: 70px;  bottom: 260px; right: 110px; background: rgba(255,255,255,0.2); }

  .frame {
    position: absolute;
    inset: 48px;
    border: 2px solid rgba(255, 255, 255, 0.65);
    border-radius: 36px;
  }

  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 120px 110px;
    gap: 44px;
  }

  .greeting {
    font-family: 'Great Vibes', cursive;
    font-size: 118px;
    color: var(--accent);
    line-height: 1.1;
  }

  .ornament {
    display: flex;
    align-items: center;
    gap: 18px;
    color: var(--accent);
    opacity: 0.85;
  }
  .ornament .line {
    width: 120px;
    height: 2px;
    background: var(--accent);
    opacity: 0.6;
  }
  .ornament .sun { font-size: 34px; }

  .quote {
    font-size: {{FONT_SIZE}}px;
    font-weight: 500;
    font-style: italic;
    color: var(--ink);
    line-height: 1.45;
    max-width: 840px;
    text-wrap: balance;
  }

  .card {
    background: var(--soft);
    border-radius: 28px;
    padding: 64px 56px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.10);
    backdrop-filter: blur(2px);
  }

  .date {
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    font-size: 30px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.75;
  }

  .footer {
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    font-size: 26px;
    letter-spacing: 3px;
    color: var(--ink);
    opacity: 0.6;
  }
</style>
</head>
<body class="{{THEME}}">
  <div class="circle c1"></div>
  <div class="circle c2"></div>
  <div class="circle c3"></div>
  <div class="circle c4"></div>
  <div class="frame"></div>
  <div class="content">
    <div class="greeting">Good Morning</div>
    <div class="ornament">
      <div class="line"></div>
      <div class="sun">☀</div>
      <div class="line"></div>
    </div>
    <div class="card">
      <div class="quote">{{QUOTE}}</div>
    </div>
    <div class="date">{{DATE}}</div>
    <div class="footer">Have a blessed &amp; beautiful day</div>
  </div>
</body>
</html>
